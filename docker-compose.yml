version: '3.8'

services:
  gods-eye-view:
    build: .
    container_name: gods-eye-view
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # ==========================================================
      # NOTE: Pass these variables securely via your deployment 
      # environment or an external .env file.
      # ==========================================================
      - HOST_PORT
      - GOOGLE_MAPS_API_KEY
      - OPENAI_API_KEY
      - AISSTREAM_API_KEY
      - FIRMS_MAP_KEY
      - TOMTOM_API_KEY
      - CESIUM_ION_TOKEN
      - OPENSKY_AUTH_MODE
      - OPENSKY_CLIENT_ID
      - OPENSKY_CLIENT_SECRET
      - OPENSKY_USERNAME
      - OPENSKY_PASSWORD

# Alternatively, you can use an external .env file:
# env_file:
#   - .env
